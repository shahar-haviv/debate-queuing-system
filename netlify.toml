# Netlify build configuration - Candidate Queue & Dispatch.
#
# The app is a pure static SPA built with Bun + Vite: `bun run build` typechecks
# with `tsc` and emits `dist/`. Runtime configuration is compiled into the bundle
# from VITE_* variables (see .env.example); no host secrets are required.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.2.19"

# Single-page app fallback. Every route (/login, /admin, /candidate/:id) must
# serve index.html so React Router can handle it - otherwise a refresh or a
# direct visit to any non-root URL 404s. This catch-all is last by Netlify's
# rules, so real static assets (hashed JS/CSS, /ru-debate.png) still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Response headers.
#
# A static bundle has two caching rules: Vite's hashed assets are immutable,
# and every HTML document must be revalidated so a new deploy is picked up.
# The document is never framed, and the browser is told not to sniff types.
#
# No CSP here on purpose: Tailwind/Recharts emit inline styles and the
# Supabase client needs https://*.supabase.co and wss://*.supabase.co in
# connect-src. Add a tested CSP as its own change, not as a deploy-day guess.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
